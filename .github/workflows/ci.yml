name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_marine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_marine_test?schema=public
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_marine_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
