services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus_marine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_marine"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus}@db:5432/nexus_marine?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET en az 32 karakter olmalı}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.nexusmarine.com}
      EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-true}
    ports:
      - "4000:4000"
    volumes:
      - storage:/data

volumes:
  pgdata:
  storage:
