services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus_marine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_marine"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus}@db:5432/nexus_marine?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET en az 32 karakter olmalı}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.nexusmarine.com}
      EXPO_PUSH_ENABLED: ${EXPO_PUSH_ENABLED:-true}
    # Caddy'siz kurulumda uygulama doğrudan http://SUNUCU_IP:4000 adresinden açılır.
    # Caddy kullanırken .env içinde APP_BIND=127.0.0.1 yapın (4000 dışarıya kapanır).
    ports:
      - "${APP_BIND:-0.0.0.0}:4000:4000"
    volumes:
      - storage:/data

  # İsteğe bağlı: HTTPS (Let's Encrypt) ve ters proxy.
  # Yalnızca  docker compose --profile https up -d  ile başlar.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
